<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141c2b">
<title>Gérer les tâches</title>
<link rel="stylesheet" href="/kids/style.css?v=3">
<style>
  .wrap { max-width: 760px; margin: 0 auto; }
  .tabs { display: flex; gap: 10px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }
  .tab { background: var(--bg2); color: var(--muted); border: 1px solid transparent;
         border-radius: 999px; padding: 9px 18px; font: 600 15px system-ui; cursor: pointer; }
  .tab.on { color: var(--fg); border-color: var(--accent); }

  .panel { background: var(--bg2); border-radius: 18px; padding: 16px; margin-bottom: 18px; }
  .panel h2 { margin: 0 0 12px; font-size: 17px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], select {
    width: 100%; background: #0f1626; color: var(--fg); border: 1px solid rgba(255,255,255,.15);
    border-radius: 12px; padding: 12px 14px; font: 16px system-ui;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > * { flex: 1 1 140px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .chip { background: #0f1626; color: var(--muted); border: 1px solid rgba(255,255,255,.15);
          border-radius: 999px; padding: 8px 12px; font: 500 14px system-ui; cursor: pointer; }
  .chip.on { background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: 700; }
  .go { background: #2a7d46; color: #fff; border: none; border-radius: 999px;
        padding: 13px 20px; font: 700 16px system-ui; cursor: pointer; width: 100%; margin-top: 14px; }
  .go:active { transform: scale(.98); }
  .go.sec { background: #33405a; }

  .person { margin-bottom: 6px; }
  .person h3 { font-size: 15px; text-transform: uppercase; letter-spacing: 1px;
               color: var(--fg); margin: 16px 0 6px; border-bottom: 1px solid rgba(255,255,255,.15); padding-bottom: 4px; }
  .task { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .task .t { flex: 1 1 auto; min-width: 0; }
  .task .meta { font-size: 12px; color: var(--muted); }
  .icon-btn { background: none; border: none; color: var(--muted); font-size: 19px; cursor: pointer; padding: 6px 8px; }
  .icon-btn:active { color: var(--fg); }
  .task .t.done { opacity: .5; text-decoration: line-through; }
  .price { color: var(--accent); font-weight: 700; }

  /* edit dialog (reuses .overlay / .dialog from style.css) */
  .dialog.form { text-align: left; max-width: 460px; }
  .dialog.form h2 { margin: 0 0 6px; font-size: 19px; text-align: center; }
  .dlg-actions { display: flex; gap: 12px; margin-top: 20px; }
  .dlg-actions .go { margin-top: 0; }
</style>
</head>
<body>
<section class="screen wrap">
  <h1>🧹 Gérer les tâches</h1>
  <div class="tabs">
    <button class="tab on" data-tab="add">＋ Nouvelle</button>
    <button class="tab" data-tab="daily">🔁 Quotidiennes</button>
    <button class="tab" data-tab="todo">✅ À faire</button>
    <button class="tab" data-tab="reward">🎁 Récompenses</button>
    <a class="tab" href="/kids/parent.html">📦 À remettre</a>
    <a class="tab" href="/kids">← Visages</a>
  </div>

  <!-- add -->
  <div id="pane-add" class="panel">
    <h2>Ajouter</h2>
    <label>Type</label>
    <select id="type">
      <option value="daily" selected>🔁 Quotidienne (revient chaque jour)</option>
      <option value="todo">✅ À faire une fois</option>
      <option value="reward">🎁 Récompense (s'achète avec l'or)</option>
    </select>
    <label>Texte (commence par un emoji pour les petits)</label>
    <input type="text" id="text" placeholder="🧹 Ranger sa chambre">
    <div class="row">
      <div>
        <label>Pour qui</label>
        <select id="who"></select>
      </div>
      <div id="diff-wrap">
        <label>Difficulté</label>
        <select id="difficulty">
          <option value="trivial">Triviale</option>
          <option value="easy" selected>Facile</option>
          <option value="medium">Moyenne</option>
          <option value="hard">Difficile</option>
        </select>
      </div>
      <div id="price-wrap" class="hidden">
        <label>Prix (or)</label>
        <input type="text" id="price" inputmode="numeric" placeholder="15">
      </div>
    </div>
    <div id="days-wrap">
      <label>Jours (aucun = tous les jours)</label>
      <div class="chips" id="days"></div>
    </div>
    <button class="go" id="addBtn">Ajouter</button>
  </div>

  <!-- list -->
  <div id="pane-list" class="panel hidden">
    <h2 id="list-title">Tâches existantes</h2>
    <div id="list"><p class="muted">Chargement…</p></div>
  </div>
</section>

<!-- edit -->
<div id="edit" class="overlay hidden">
  <div class="dialog form">
    <h2 id="e-title">Modifier</h2>
    <label>Texte</label>
    <input type="text" id="e-text">
    <div id="e-diff-wrap">
      <label>Difficulté</label>
      <select id="e-diff">
        <option value="trivial">Triviale</option>
        <option value="easy">Facile</option>
        <option value="medium">Moyenne</option>
        <option value="hard">Difficile</option>
      </select>
    </div>
    <div id="e-price-wrap" class="hidden">
      <label>Prix (or)</label>
      <input type="text" id="e-price" inputmode="numeric">
    </div>
    <div id="e-days-wrap">
      <label>Jours (aucun = tous les jours)</label>
      <div class="chips" id="e-days"></div>
    </div>
    <div class="dlg-actions">
      <button class="go sec" id="e-cancel">Annuler</button>
      <button class="go" id="e-save">Enregistrer</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const DAYS = [["m","Lun"],["t","Mar"],["w","Mer"],["th","Jeu"],["f","Ven"],["s","Sam"],["su","Dim"]];
  const LABEL = { daily: "Quotidiennes", todo: "À faire", reward: "Récompenses" };
  let people = [], view = "daily", editing = null;
  const chosen = new Set(), eChosen = new Set();

  const toast = (m) => { const t=$("toast"); t.textContent=m; t.classList.remove("hidden");
    clearTimeout(t._h); t._h=setTimeout(()=>t.classList.add("hidden"),2400); };

  const mkChips = (host, set) => DAYS.forEach(([code,label]) => {
    const b=document.createElement("button");
    b.className="chip"; b.textContent=label; b.dataset.code=code;
    b.onclick=()=>{ set.has(code)?set.delete(code):set.add(code); b.classList.toggle("on"); };
    host.appendChild(b);
  });
  mkChips($("days"), chosen);
  mkChips($("e-days"), eChosen);

  // the add form changes shape with the type
  function syncAddForm() {
    const t = $("type").value;
    $("days-wrap").classList.toggle("hidden", t !== "daily");
    $("diff-wrap").classList.toggle("hidden", t === "reward");
    $("price-wrap").classList.toggle("hidden", t !== "reward");
    // household rewards aren't buyable from the kids page yet — don't offer them
    const house = $("who").querySelector('option[value="__house__"]');
    if (house) { house.hidden = (t === "reward"); house.disabled = (t === "reward"); }
    if (t === "reward" && $("who").value === "__house__") $("who").value = "__all__";
  }
  $("type").onchange = syncAddForm;

  async function loadPeople() {
    const { people: p } = await (await fetch("/_hk/manage/people")).json();
    people = p;
    $("who").innerHTML = "";
    const opts = [["__all__","👨‍👩‍👧‍👦 Tout le monde"],["__house__","🏠 Tâche de maison (partagée)"]]
      .concat(p.map(n=>[n,n]));
    for (const [v,l] of opts) { const o=document.createElement("option"); o.value=v; o.textContent=l; $("who").appendChild(o); }
    syncAddForm();
  }

  $("addBtn").onclick = async () => {
    const text = $("text").value.trim();
    if (!text) return toast("Écris le texte");
    const type = $("type").value;
    const who = $("who").value;
    const body = { text, type, difficulty: $("difficulty").value };
    if (type === "daily" && chosen.size) body.days = [...chosen].join(",");
    if (type === "reward") {
      const v = parseInt($("price").value, 10);
      if (!(v > 0)) return toast("Donne un prix en or");
      body.value = v;
    }
    if (who === "__all__") body.everyone = true;
    else if (who === "__house__") body.house = true;
    else body.who = who;
    const r = await fetch("/_hk/manage/add", { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok) return toast("Oups : " + (j.error||""));
    toast("Ajouté ✓");
    $("text").value = ""; $("price").value = ""; chosen.clear();
    document.querySelectorAll("#days .chip").forEach(c=>c.classList.remove("on"));
    if (!$("pane-list").classList.contains("hidden")) loadList();
  };

  async function loadList() {
    const el = $("list"); el.innerHTML = '<p class="muted">Chargement…</p>';
    $("list-title").textContent = LABEL[view];
    const r = await fetch("/_hk/manage/chores?type=" + view);
    const { chores, house } = await r.json();
    el.innerHTML = "";
    const byPerson = {};
    (chores||[]).forEach(c => { (byPerson[c.person] = byPerson[c.person] || []).push(c); });

    const section = (title, items, isHouse) => {
      const d=document.createElement("div"); d.className="person";
      const h=document.createElement("h3"); h.textContent=title; d.appendChild(h);
      if (!items.length) { const p=document.createElement("p"); p.className="muted"; p.textContent="—"; d.appendChild(p); }
      items.forEach(c => {
        const row=document.createElement("div"); row.className="task";
        const t=document.createElement("div"); t.className="t"+(c.completed?" done":"");
        const name=document.createElement("div"); name.textContent=c.text; t.appendChild(name);
        const meta=document.createElement("div"); meta.className="meta";
        const bits = [];
        if (view === "reward") bits.push(c.value + " or");
        else bits.push(c.difficulty);
        if (view === "daily") bits.push(c.days || "tous les jours");
        if (isHouse && c.assigned) bits.push("→ " + c.assigned.join(", "));
        meta.textContent = bits.filter(Boolean).join(" · ");
        t.appendChild(meta); row.appendChild(t);

        // household tasks live on the party, not on a person — no per-person edit
        if (!isHouse) {
          const ed=document.createElement("button"); ed.className="icon-btn"; ed.textContent="✏️"; ed.title="Modifier";
          ed.onclick=()=>openEdit(c);
          row.appendChild(ed);
        }
        const del=document.createElement("button"); del.className="icon-btn"; del.textContent="🗑"; del.title="Supprimer";
        del.onclick=async()=>{
          if(!confirm("Supprimer « "+c.text+" » ?")) return;
          const body = isHouse ? { house:true, task:c.id } : { who:c.person, task:c.id };
          const rr=await fetch("/_hk/manage/remove",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
          if(rr.ok){toast("Supprimé");loadList();} else toast("Oups");
        };
        row.appendChild(del);
        d.appendChild(row);
      });
      el.appendChild(d);
    };

    const houseOfType = (house||[]).filter(h => h.type === view);
    if (houseOfType.length) section("🏠 Maison (partagées)", houseOfType, true);
    Object.keys(byPerson).forEach(n => section(n, byPerson[n], false));
    if (!houseOfType.length && !Object.keys(byPerson).length) {
      el.innerHTML = '<p class="muted">Rien ici.</p>';
    }
  }

  function openEdit(c) {
    editing = c;
    $("e-title").textContent = c.text;
    $("e-text").value = c.text;
    $("e-diff").value = c.difficulty || "easy";
    $("e-price").value = c.value != null ? c.value : "";
    $("e-diff-wrap").classList.toggle("hidden", view === "reward");
    $("e-price-wrap").classList.toggle("hidden", view !== "reward");
    $("e-days-wrap").classList.toggle("hidden", view !== "daily");
    eChosen.clear();
    (c.days ? String(c.days).split(",") : []).forEach(d => eChosen.add(d));
    document.querySelectorAll("#e-days .chip").forEach(ch => ch.classList.toggle("on", eChosen.has(ch.dataset.code)));
    $("edit").classList.remove("hidden");
  }
  const closeEdit = () => { editing = null; $("edit").classList.add("hidden"); };
  $("e-cancel").onclick = closeEdit;
  $("edit").onclick = (e) => { if (e.target === $("edit")) closeEdit(); };

  $("e-save").onclick = async () => {
    if (!editing) return;
    const body = { who: editing.person, task: editing.id };
    const text = $("e-text").value.trim();
    if (text && text !== editing.text) body.text = text;
    if (view === "reward") {
      const v = parseInt($("e-price").value, 10);
      if (!(v > 0)) return toast("Donne un prix en or");
      if (v !== editing.value) body.value = v;
    } else {
      if ($("e-diff").value !== editing.difficulty) body.difficulty = $("e-diff").value;
    }
    if (view === "daily") {
      const days = [...eChosen].join(",");
      if (days !== (editing.days || "")) body.days = days || "daily";
    }
    if (Object.keys(body).length <= 2) { closeEdit(); return toast("Rien de changé"); }
    const r = await fetch("/_hk/manage/update", { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok) return toast("Oups : " + (j.error||""));
    closeEdit(); toast("Modifié ✓"); loadList();
  };

  document.querySelectorAll(".tab[data-tab]").forEach(t => {
    t.onclick = () => {
      document.querySelectorAll(".tab[data-tab]").forEach(x=>x.classList.remove("on"));
      t.classList.add("on");
      const tab = t.dataset.tab;
      const add = tab === "add";
      $("pane-add").classList.toggle("hidden", !add);
      $("pane-list").classList.toggle("hidden", add);
      if (!add) { view = tab; loadList(); }
    };
  });

  loadPeople();
})();
</script>
</body>
</html>
