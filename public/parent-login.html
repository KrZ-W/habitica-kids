<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141c2b">
<title>Parents</title>
<link rel="stylesheet" href="/kids/style.css">
<style>
  .pin-wrap { max-width: 330px; margin: 6vh auto 0; text-align: center; }
  .dots { display: flex; justify-content: center; gap: 14px; margin: 26px 0 30px; }
  .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--muted); }
  .dot.on { background: var(--accent); border-color: var(--accent); }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .key { background: var(--bg2); color: var(--fg); border: none; border-radius: 18px;
         padding: 20px 0; font: 600 26px system-ui; cursor: pointer; }
  .key:active { background: #263349; }
  .key.wide { grid-column: span 1; font-size: 18px; }
  .err { color: #ff8a80; min-height: 22px; margin-top: 14px; }
  .back-link { display: inline-block; margin-top: 26px; color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<section class="screen pin-wrap">
  <h1>🔒 Parents</h1>
  <div class="dots" id="dots"></div>
  <div class="pad" id="pad"></div>
  <p class="err" id="err"></p>
  <a class="back-link" href="/kids">← Retour aux visages</a>
</section>
<script>
(() => {
  const LEN = 4;
  let pin = "";
  const dots = document.getElementById("dots"), pad = document.getElementById("pad"), err = document.getElementById("err");

  function draw() {
    dots.innerHTML = "";
    for (let i = 0; i < LEN; i++) {
      const d = document.createElement("div");
      d.className = "dot" + (i < pin.length ? " on" : "");
      dots.appendChild(d);
    }
  }
  async function submit() {
    const r = await fetch("/_hk/parent-login", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ pin })
    });
    if (r.ok) { location.replace("/kids/parent.html"); return; }
    err.textContent = "Code incorrect";
    pin = ""; draw();
    setTimeout(() => (err.textContent = ""), 1800);
  }
  function press(k) {
    if (k === "del") pin = pin.slice(0, -1);
    else if (pin.length < LEN) pin += k;
    draw();
    if (pin.length === LEN) setTimeout(submit, 120);
  }
  ["1","2","3","4","5","6","7","8","9","del","0"].forEach((k) => {
    const b = document.createElement("button");
    b.className = "key" + (k === "del" ? " wide" : "");
    b.textContent = k === "del" ? "⌫" : k;
    b.onclick = () => press(k);
    pad.appendChild(b);
  });
  document.addEventListener("keydown", (e) => {
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === "Backspace") press("del");
  });
  draw();
})();
</script>
</body>
</html>
